<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="colorField" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c99225"/><stop offset=".14" stop-color="#d36c98"/>
      <stop offset=".31" stop-color="#364ec5"/><stop offset=".49" stop-color="#050a18"/>
      <stop offset=".67" stop-color="#183dba"/><stop offset=".84" stop-color="#bb578f"/>
      <stop offset="1" stop-color="#b98222"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.045 0;.045 0;-.045 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="reed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02050d" stop-opacity=".96"/>
      <stop offset=".19" stop-color="#101a31" stop-opacity=".55"/>
      <stop offset=".43" stop-color="white" stop-opacity=".34"/>
      <stop offset=".61" stop-color="white" stop-opacity=".08"/>
      <stop offset=".79" stop-color="#02050d" stop-opacity=".88"/>
      <stop offset="1" stop-color="#01030a"/>
    </linearGradient>
    <pattern id="reeds" width="38" height="1000" patternUnits="userSpaceOnUse">
      <rect width="38" height="1000" fill="url(#reed)"/>
    </pattern>
    <radialGradient id="softLens">
      <stop offset="0" stop-color="white" stop-opacity=".98"/>
      <stop offset=".56" stop-color="white" stop-opacity=".82"/>
      <stop offset=".82" stop-color="white" stop-opacity=".27"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>
    <mask id="lensMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1000">
      <ellipse cy="500" rx="430" ry="360" fill="url(#softLens)">
        <animate attributeName="cx" values="510;1090;510" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="360;500;360" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="300;410;300" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </mask>
    <radialGradient id="lensLight"><stop offset="0" stop-color="#91a8ff" stop-opacity=".34"/><stop offset=".66" stop-color="#7050d5" stop-opacity=".13"/><stop offset="1" stop-color="#050812" stop-opacity="0"/></radialGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="78%"><stop offset="0" stop-color="#02040a" stop-opacity="0"/><stop offset=".68" stop-color="#02040a" stop-opacity=".25"/><stop offset="1" stop-color="#02040a" stop-opacity=".8"/></radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="#030711"/>
  <g>
    <rect x="-120" y="-120" width="1840" height="1240" fill="url(#colorField)" opacity=".72"/>
    <rect x="-120" y="-120" width="1840" height="1240" fill="url(#reeds)" opacity=".9"/>
    <!-- Одна крупная линза синхронно растягивает все рёбра внутри себя. -->
    <g mask="url(#lensMask)">
      <g transform="translate(800 500)">
        <g>
          <animateTransform attributeName="transform" type="scale" values=".52 1;1.48 1;.52 1" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
          <rect x="-1100" y="-650" width="2200" height="1300" fill="url(#colorField)" opacity=".92"/>
          <rect x="-1100" y="-650" width="2200" height="1300" fill="url(#reeds)" opacity=".98"/>
        </g>
      </g>
      <ellipse cy="500" rx="430" ry="360" fill="url(#lensLight)">
        <animate attributeName="cx" values="510;1090;510" keyTimes="0;.5;1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="360;500;360" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="300;410;300" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
  <rect width="1600" height="1000" fill="url(#vignette)"/>
</svg>
