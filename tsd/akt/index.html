<body data-mode="perf" class="tsdStranica">
  <!-- Актировка со скана: пикнул товар, ткнул дефект — в вмс создан акт
       приёмки (внутренний брак). Для разбора паллет с неактированным браком. -->
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="Уценка — главная">
        <img class="brand__mark" src="../../assets/brand/vi-mark.svg" alt="" width="36" height="36">
        <span>Уценка</span>
      </a>
    </header>

    <p class="tsdDemo" id="aktDemo">Демо: товары настоящие (лежат в ФБ ДМД без акта), акты условные, в вмс ничего не уходит. Сканируйте что угодно или жмите Enter.</p>

    <section class="tsdEkran">
      <form id="aktForma" autocomplete="off">
        <label class="tsdSkan"><span>Отсканируйте товар</span>
          <input id="aktSkan" inputmode="none" placeholder="штрихкод товара" autofocus></label>
      </form>
      <div id="aktKarta"></div>
      <div id="aktZhurnal"></div>
    </section>
  </main>
