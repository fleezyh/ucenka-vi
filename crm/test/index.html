<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM продаж · тест · Уценка</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/brand/vi-mark.svg">
  <link rel="preload" href="../../assets/fonts/VI_Sans_DemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../style.css?v=20260921-1">
  <link rel="stylesheet" href="../../perf/perf.css?v=20260921-2">
  <link rel="stylesheet" href="../crm.css?v=20260923-3">
  <link rel="stylesheet" href="test.css?v=20260923-6">
  <link rel="stylesheet" href="../../reeded-bg.css?v=20260907-6">
  <link rel="stylesheet" href="../../site-header.css?v=20260921-1">
  <script src="../../reeded-bg.js?v=20260906-7" defer></script>
  <script src="crm.js?v=20260923-6" defer></script>
  <script src="../../nav.js?v=20260921-1" defer></script>
</head>
<body data-mode="perf" class="crmTest">
  <!-- Тестовая версия CRM: доска как рабочее место. Боевая — /crm/, её этот
       файл не трогает. Данные и ручки те же, правки сохраняются по-настоящему. -->
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="Уценка — главная">
        <img class="brand__mark" src="../../assets/brand/vi-mark.svg" alt="" width="36" height="36">
        <span>Уценка</span>
      </a>
      <nav class="siteNav" aria-label="Разделы сайта">
        <span class="navGroup">
          <span class="navGroup__label">Уценка</span>
          <a class="navLink" href="../../antigen/">Антигенерация</a>
          <a class="navLink" href="../../heatmap/">Хитмап</a>
          <a class="navLink" href="../../sales/">Продажи</a>
          <a class="navLink" href="../../perf/">Производительность</a>
        </span>
        <span class="navGroup">
          <span class="navGroup__label">Инструменты</span>
          <a class="navLink" href="../../picker/">Пикалка</a>
        </span>
      </nav>
    </header>

    <div class="ctShapka">
      <div class="ctShapka__imya">
        <h1>CRM продаж</h1>
        <span class="ctTest">тестовая версия · <a href="../">вернуться в старую</a></span>
      </div>
      <div class="ctPlan" id="crmPlitki"></div>
      <p class="stamp" id="stamp"></p>
    </div>

    <p class="message" id="message">Загружаю…</p>

    <section class="crmVoronka" id="crmVoronka" hidden></section>

    <section class="crmPanel ctPanel" id="crmPanel" hidden>
      <div class="ctVerh">
        <nav class="crmVidy ctVidy" aria-label="Что показываем">
          <button class="crmVid is-on" type="button" data-vid="doska">Доска</button>
          <button class="crmVid" type="button" data-vid="zadachi">Дела</button>
          <button class="crmVid" type="button" data-vid="loty">Таблица</button>
          <button class="crmVid" type="button" data-vid="ka">Контрагенты</button>
        </nav>
        <div class="crmPanel__act">
          <select class="crmVybor" id="crmKto" aria-label="Менеджер"></select>
          <select class="crmVybor" id="crmSklad" aria-label="Склад"></select>
          <input class="crmPoisk" id="crmPoisk" type="search" placeholder="Поиск: лот, КА, комментарий">
          <button class="crmKn" type="button" id="crmNabor" hidden>Все колонки</button>
          <button class="crmKn crmKn--glav" type="button" id="crmNovyy">+ Лот</button>
          <button class="crmKolokol" type="button" id="crmKolokol" hidden></button>
          <button class="crmTema" type="button" id="crmTema">Светлая тема</button>
        </div>
      </div>
      <div class="ctDela" id="crmGorit"></div>
      <div class="crmPanel__head">
        <div class="crmFiltry" id="crmFiltry"></div>
      </div>
      <p class="crmSchyot" id="crmSchyot"></p>
      <div class="crmDoska ctDoska" id="crmDoska"></div>
      <div class="crmTabl" id="crmTabl"></div>
      <div class="crmZadachi" id="crmZadachi" hidden></div>
      <div class="crmSverka" id="crmSverka" hidden></div>
    </section>

    <!-- Связь — боковой панелью, как виджет мессенджера на сайте: почта уже
         работает, мессенджер встанет сюда же, когда дадут доступ к API. -->
    <button class="ctSvyazKn" id="ctSvyazKn" type="button" title="Почта и мессенджер">
      <span aria-hidden="true">✉</span> Связь
    </button>
    <aside class="ctSvyaz" id="ctSvyaz" hidden aria-label="Почта и мессенджер">
      <header class="ctSvyaz__shapka">
        <nav class="ctSvyaz__vidy">
          <button class="is-on" type="button" data-svyaz="pochta">Почта</button>
          <button type="button" data-svyaz="messendzher">Мессенджер</button>
        </nav>
        <button class="ctSvyaz__zakryt" id="ctSvyazZakryt" type="button" title="Закрыть">×</button>
      </header>
      <div class="ctSvyaz__telo">
        <div class="crmPochtaVid" id="crmPochtaVid"></div>
        <div class="ctSvyaz__messendzher" id="ctMessendzher" hidden>
          <p>Здесь будет Яндекс Мессенджер — чаты с коллегами и контрагентами,
            не уходя из CRM.</p>
          <p class="crmHint">встраивается виджетом Яндекс 360; подключим, когда
            дадут доступ к API.</p>
        </div>
      </div>
    </aside>

    <div class="crmOkno" id="crmOkno" hidden>
      <div class="crmOkno__fon" id="crmOknoFon"></div>
      <article class="crmOkno__doc" role="dialog" aria-modal="true" id="crmOknoDoc"></article>
    </div>
  </main>
</body>
</html>
