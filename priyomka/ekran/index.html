<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b11">
  <title>Склад ДМД · обстановка</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/brand/vi-mark.svg">
  <link rel="preload" href="../../assets/fonts/VI_Sans_Regular.woff2" as="font" type="font/woff2" crossorigin>
  <!-- Только ради шрифта: экран живёт без шапки сайта. -->
  <link rel="stylesheet" href="../../style.css?v=20260911-3">
  <link rel="stylesheet" href="ekran.css?v=20260923-2">
  <script src="../cepochka.js?v=20260923-4" defer></script>
  <script src="ekran.js?v=20260925-1" defer></script>
</head>
<body class="ekran">
  <!-- Карта склада сверху: двор, здание, стена приёмки. Обстановку видно по
       движению и цвету, а не по цифрам: машины едут точками, товар бежит от
       ворот внутрь, забитые места краснеют. -->
  <main class="ek">
    <header class="ekShapka">
      <div class="ekShapka__imya">
        <img src="../../assets/brand/vi-mark.svg" alt="" width="34" height="34">
        <div><b>Склад Домодедово</b><span>вход: от шлагбаума до ячейки</span></div>
      </div>
      <div class="ekStatus" id="ekStatus">загружаю…</div>
      <div class="ekVremya">
        <b id="ekChasy">--:--</b>
        <span id="ekData"></span>
      </div>
      <button type="button" class="ekPolnyi" id="ekPolnyi" title="Во весь экран">⛶</button>
    </header>

    <section class="ekKarta" id="ekKarta" aria-label="Карта склада"></section>

    <section class="ekNiz">
      <ol class="ekTrevogi" id="ekTrevogi" aria-label="Тревоги"></ol>
      <div class="ekKrivaya">
        <div class="ekKrivaya__zag">очередь у ворот за сутки
          <span><i class="is-segodnya"></i>сегодня <i class="is-vchera"></i>вчера</span></div>
        <div class="ekKrivaya__holst" id="ekKrivaya"></div>
      </div>
    </section>

    <footer class="ekPodval" id="ekSvezhest"></footer>
  </main>
</body>
</html>
