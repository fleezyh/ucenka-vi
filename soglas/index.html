<body data-mode="perf" class="crmTest">
  <!-- ДВК и СБ — то же рабочее место, что вкладка «ДВК» в CRM (28.09.2026):
       раздела CRM у них нет, поэтому своя дверь с тем же видом. -->
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="../" aria-label="Уценка — главная">
        <img class="brand__mark" src="../assets/brand/vi-mark.svg" alt="" width="36" height="36">
        <span>Уценка</span>
      </a>
    </header>

    <section class="heroPerf">
      <div>
        <p class="eyebrow">Продажи · ДВК</p>
        <h1>ДВК</h1>
        <p class="lead">Проверить паллету и повесить пломбу, согласовать отгрузку лота.
          Паллету без пломбы не продают, не берут в лот и не согласуют.</p>
      </div>
    </section>

    <section class="crmPanel ctPanel">
      <div class="crmDvk" id="dvk"></div>
    </section>
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const q = new URLSearchParams(location.search);
      const h = location.hash.replace("#", "");
      window.Dvk.mount(document.getElementById("dvk"), {
        razdel: q.get("id") ? "soglas" : (h === "plomby" || h === "soglas" ? h : ""),
        zayavka: q.get("id") || "",
      });
    });
  </script>
